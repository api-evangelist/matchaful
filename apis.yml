aid: matchaful
name: Matchaful
description: >-
  Matchaful is a premium Japanese matcha brand selling single-origin,
  organically-grown ceremonial matcha from Shizuoka, Japan — ground to order,
  pesticide-free, and third-party tested under its Farm-to-Whisk program. It sells
  direct-to-consumer through a Shopify storefront and runs physical cafes, and is a
  Techstars portfolio company. Matchaful publishes no traditional developer REST API
  or OpenAPI, but its Shopify storefront exposes a live agent-commerce surface: an
  /llms.txt and /agents.md agent instruction set, a Universal Commerce Protocol (UCP,
  ucp.dev) merchant profile at /.well-known/ucp, a first-party MCP shopping endpoint
  at /api/ucp/mcp, and Shopify Customer Account OIDC/OAuth discovery documents served
  under the store domain.
